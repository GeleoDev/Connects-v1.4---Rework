<!DOCTYPE html>
<html lang="es" data-root-depth="1">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Connects</title>
  <meta name="description" content="Contactá a Connects. Tacuarí 1777, CABA. ventas@connects.com.ar">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Sora:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/home.css">
</head>
<body>
  <div class="page">
    <div data-inject-nav></div>
    <header class="page-hero">
      <div class="container">
        <nav class="crumbs"><a href="../">Inicio</a><span>/</span><span>Contacto</span></nav>
        <span class="eyebrow">Contacto</span>
        <h1>Hablemos de tu proyecto</h1>
        <p class="lead">Contanos requisitos, sitios y plazos. También podés visitarnos en Tacuarí 1777, CABA.</p>
      </div>
    </header>
    <section class="section container">
      <div class="contact-grid">
        <div>
          <div class="panel reveal" style="margin-bottom:1rem">
            <h3 style="margin-bottom:1rem">Datos</h3>
            <p style="margin-bottom:.85rem;color:var(--text-dim)"><strong style="color:var(--text)">Email</strong><br><a href="mailto:ventas@connects.com.ar" style="color:var(--cyan)">ventas@connects.com.ar</a></p>
            <p style="margin-bottom:.85rem;color:var(--text-dim)"><strong style="color:var(--text)">Dirección</strong><br>Tacuarí 1777, CABA, Argentina</p>
            <p style="color:var(--text-mute);font-size:.95rem">Atención a empresas, integradores y áreas de IT/OT.</p>
          </div>
          <form class="form-dark reveal" action="https://formsubmit.co/ventas@connects.com.ar" method="POST">
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_subject" value="Nuevo mensaje desde Connects Rework C">
            <div class="form-row"><label for="name">Nombre</label><input id="name" name="name" required autocomplete="name"></div>
            <div class="form-row"><label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email"></div>
            <div class="form-row"><label for="phone">Teléfono (opcional)</label><input id="phone" type="tel" name="phone"></div>
            <div class="form-row"><label for="message">Mensaje</label><textarea id="message" name="message" required placeholder="Contexto del proyecto, sites, tecnologías de interés…"></textarea></div>
            <button class="btn btn-primary" type="submit">Enviar consulta</button>
          </form>
        </div>
        <div class="map-wrap reveal">
          <iframe title="Ubicación Connects"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3284.0168943847!2d-58.3786249!3d-34.6286083!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bccb33c9ea6ea3%3A0xdf27bc71aab17be2!2sTacuar%C3%AD%201777!5e0!3m2!1ses!2sar!4v1717856876543!5m2!1ses!2sar"
            loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
        </div>
      </div>
    </section>
    <div data-inject-footer></div>
  </div>
  <script src="../js/inject.js"></script>
  <script src="../js/navbar.js"></script>
  <script src="../js/motion.js"></script>
</body>
</html>
